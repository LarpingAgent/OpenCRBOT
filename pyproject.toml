[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrbot"
version = "0.1.0"
description = "Screen-only Clash Royale research toolkit for Google Play Games on PC Developer Emulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = ["Pillow>=11.2.1; sys_platform == 'win32'"]
tracking = ["lap>=0.5.12"]
vision = [
    "ultralytics>=8.4,<9",
    "numpy>=1.26",
]

[project.scripts]
opencrbot = "opencrbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
